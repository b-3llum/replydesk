<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>{% block title %}ReplyDesk{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="{% block body_class %}{% endblock %}">
<main class="page {% block page_class %}{% endblock %}">
{% block top %}{% endblock %}
{% block content %}{% endblock %}
</main>
{% block after_main %}{% endblock %}

<script>
// Copy text, then show "Copied" on the button for 2 seconds.
function copyText(text, button) {
  function done() {
    if (!button.dataset.label) button.dataset.label = button.innerHTML;
    button.textContent = "Copied";
    clearTimeout(button.copyTimer);
    button.copyTimer = setTimeout(function () { button.innerHTML = button.dataset.label; }, 2000);
  }
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(done, function () { copyWithTextarea(text); done(); });
  } else {
    copyWithTextarea(text);
    done();
  }
}

// Fallback for plain-http pages and older browsers.
function copyWithTextarea(text) {
  var area = document.createElement("textarea");
  area.value = text;
  area.setAttribute("readonly", "");
  area.style.position = "fixed";
  area.style.top = "0";
  area.style.opacity = "0";
  document.body.appendChild(area);
  area.select();
  try { document.execCommand("copy"); } catch (err) {}
  document.body.removeChild(area);
}

// "Copy" buttons on review cards copy the reply in their own card.
document.addEventListener("click", function (event) {
  var button = event.target.closest("[data-copy]");
  if (!button) return;
  var card = button.closest(".review");
  copyText(card.querySelector(".reply-text").textContent.trim(), button);
});
</script>
{% block scripts %}{% endblock %}
</body>
</html>
